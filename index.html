<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفعيل الشهور بالحساب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #0056b3;
            --secondary-color: #007bff;
            --success-color: #28a745;
            --error-color: #dc3545;
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #6c757d;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box;
        }
        .container {
            background-color: var(--card-bg); padding: 40px 30px;
            border-radius: 24px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            width: 100%; max-width: 450px; text-align: center; transition: all 0.3s ease;
        }
        .brand-header { margin-bottom: 20px; }
        .logo {
            width: 120px; height: 120px; border-radius: 50%; object-fit: cover;
            box-shadow: 0 8px 16px rgba(0,0,0,0.15); margin-bottom: 10px; border: 4px solid #fff;
        }
        .brand-subtitle { color: var(--text-muted); margin: 5px 0 0 0; font-size: 16px; font-weight: 800; }
        
        .important-notice {
            background-color: #fff3cd; color: #856404; padding: 12px; border-radius: 10px;
            border: 1px solid #ffeeba; font-size: 13px; font-weight: 600; margin-bottom: 25px;
            text-align: right;
        }

        .form-group { margin-bottom: 20px; text-align: right; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--text-main); font-weight: 600; font-size: 14px; }
        input {
            width: 100%; padding: 16px; border: 2px solid #e1e5eb; border-radius: 12px; box-sizing: border-box;
            font-size: 15px; font-family: 'Cairo', sans-serif; outline: none; transition: all 0.3s ease; background-color: #f8faff;
        }
        input:focus { border-color: var(--secondary-color); background-color: #fff; box-shadow: 0 0 0 4px rgba(0, 123, 255, 0.1); }
        
        button {
            width: 100%; padding: 16px; background: linear-gradient(135deg, var(--secondary-color) 0%, var(--primary-color) 100%);
            color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 800; font-family: 'Cairo', sans-serif;
            cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 6px 15px rgba(0, 123, 255, 0.3); margin-top: 10px;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0, 123, 255, 0.4); }
        button:active { transform: translateY(1px); }
        button:disabled { background: #a5c5e8; cursor: not-allowed; transform: none; box-shadow: none; }
        
        .user-info-card {
            background-color: #d4edda; color: #155724; padding: 15px; border-radius: 12px;
            margin-bottom: 20px; border: 1px solid #c3e6cb; font-weight: 800; font-size: 18px;
            display: none; animation: fadeIn 0.5s ease;
        }
        .step-2-container {
            display: none; animation: fadeIn 0.5s ease; border-top: 2px dashed #e1e5eb;
            padding-top: 20px; margin-top: 10px;
        }
        
        .logout-btn {
            background: #f8d7da; color: #721c24; box-shadow: none; padding: 10px; margin-top: 15px; font-size: 14px;
        }
        .logout-btn:hover { background: #f5c6cb; box-shadow: none; transform: none; }

        .message {
            margin-top: 20px; font-size: 15px; font-weight: 600; padding: 12px;
            border-radius: 10px; display: none; animation: fadeIn 0.3s ease;
        }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <div class="brand-header">
        <img src="https://firebasestorage.googleapis.com/v0/b/amgg-81ac3.firebasestorage.app/o/photo_2025-10-15_16-42-23%20-%20Copy.jpg?alt=media&token=069ae4d2-c012-44d5-8f32-e8e750bbc857" alt="Logo" class="logo">
        <p class="brand-subtitle">بوابة تفعيل الاشتراكات للطلاب</p>
    </div>

    <div id="step1">
        <div class="important-notice">
            ⚠️ <strong>إشعار هام:</strong> تأكد من كتابة كلمة السر الخاصة بحسابك بشكل صحيح (الحروف الكبيرة والصغيرة تفرق).
        </div>
        <div class="form-group">
            <label for="userEmail">البريد الإلكتروني</label>
            <input type="email" id="userEmail" placeholder="أدخل إيميلك المسجل بالتطبيق..." dir="ltr">
        </div>
        <div class="form-group">
            <label for="userPassword">كلمة المرور</label>
            <input type="password" id="userPassword" placeholder="أدخل كلمة المرور..." dir="ltr">
        </div>
        <button id="loginBtn">تسجيل الدخول</button>
    </div>

    <div id="userInfoCard" class="user-info-card">
        مرحباً بك: <br><span id="userNameDisplay" style="color:#0056b3;">جاري التحميل...</span>
    </div>
    
    <div id="step2" class="step-2-container">
        <div class="form-group">
            <label for="newCode">كود التفعيل الجديد</label>
            <input type="text" id="newCode" placeholder="أدخل الكود المكون من 11 رقم هنا...">
        </div>
        <button id="activateBtn">تفعيل الحساب الآن</button>
        <button id="logoutBtn" class="logout-btn">تسجيل خروج</button>
    </div>

    <div id="message" class="message"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: 'AIzaSyCdqYrVFspJ4rZwidfaPtc9PYpNlQQm09k',
    appId: '1:284879336757:web:1f42836c2382d11b73087c',
    messagingSenderId: '284879336757',
    projectId: 'amgg-81ac3',
    authDomain: 'amgg-81ac3.firebaseapp.com',
    databaseURL: 'https://amgg-81ac3-default-rtdb.firebaseio.com',
    storageBucket: 'amgg-81ac3.firebasestorage.app'
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  const emailInput = document.getElementById('userEmail');
  const passwordInput = document.getElementById('userPassword');
  const loginBtn = document.getElementById('loginBtn');
  
  const step1Container = document.getElementById('step1');
  const step2Container = document.getElementById('step2');
  const userInfoCard = document.getElementById('userInfoCard');
  const userNameDisplay = document.getElementById('userNameDisplay');
  const newCodeInput = document.getElementById('newCode');
  const activateBtn = document.getElementById('activateBtn');
  const logoutBtn = document.getElementById('logoutBtn');
  const messageDiv = document.getElementById('message');

  let currentUserId = null;

  function showMessage(msg, isError = false) {
      if (!msg) {
          messageDiv.style.display = 'none';
          return;
      }
      messageDiv.style.display = 'block';
      messageDiv.textContent = msg;
      messageDiv.className = 'message ' + (isError ? 'error' : 'success');
  }

  // متابعة حالة تسجيل الدخول (لحماية البيانات)
  onAuthStateChanged(auth, async (user) => {
      if (user) {
          currentUserId = user.uid;
          step1Container.style.display = 'none';
          
          let studentName = "طالب";
          if(user.email.includes('@')){
              let emailPrefix = user.email.split('@')[0];
              studentName = emailPrefix.split('.').join(' ');
          } else {
              studentName = user.email;
          }
          
          userNameDisplay.textContent = studentName;
          userInfoCard.style.display = 'block';
          step2Container.style.display = 'block';
      } else {
          currentUserId = null;
          step1Container.style.display = 'block';
          userInfoCard.style.display = 'none';
          step2Container.style.display = 'none';
          emailInput.value = '';
          passwordInput.value = '';
      }
  });

  // تسجيل الدخول
  loginBtn.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();

      if (!email || !password) {
          showMessage("يرجى إدخال البريد الإلكتروني وكلمة المرور.", true);
          return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = "جاري تسجيل الدخول...";
      showMessage("", false);

      try {
          await signInWithEmailAndPassword(auth, email, password);
          showMessage("", false);
      } catch (error) {
          console.error(error);
          if (error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
              showMessage("بيانات الدخول غير صحيحة. تأكد من الإيميل وكلمة المرور.", true);
          } else {
              showMessage("حدث خطأ أثناء الاتصال. يرجى المحاولة لاحقاً.", true);
          }
      } finally {
          loginBtn.disabled = false;
          loginBtn.textContent = "تسجيل الدخول";
      }
  });

  // تسجيل الخروج
  logoutBtn.addEventListener('click', async () => {
      await signOut(auth);
      showMessage("", false);
  });

  // تفعيل الكود الجديد بصلاحيات مؤمنة 100%
  activateBtn.addEventListener('click', async () => {
      const newCode = newCodeInput.value.trim();

      if (!newCode) {
          showMessage("يرجى إدخال كود التفعيل.", true);
          return;
      }
      if (!currentUserId) {
          showMessage("حدث خطأ. يرجى تسجيل الخروج والدخول مجدداً.", true);
          return;
      }

      activateBtn.disabled = true;
      activateBtn.textContent = "جاري التفعيل...";
      showMessage("", false);

      try {
          const newCodeRef = ref(db, `codes/${newCode}`);
          const newCodeSnap = await get(newCodeRef);

          if (!newCodeSnap.exists()) {
              showMessage("الكود غير صحيح أو غير موجود بالنظام.", true);
              resetActivateButton();
              return;
          }

          const newCodeData = newCodeSnap.val();
          
          if (newCodeData.isUsed) {
              showMessage("عذراً، هذا الكود مستخدم بالفعل!", true);
              resetActivateButton();
              return;
          }

          const monthsToActivate = newCodeData.months || [];
          if (monthsToActivate.length === 0) {
              showMessage("الكود لا يحتوي على أي شهور لتفعيلها.", true);
              resetActivateButton();
              return;
          }

          const daysToMilliseonds = 30 * 24 * 60 * 60 * 1000;
          const expiryTimestamp = Date.now() + daysToMilliseonds;

          // تحديث البيانات بطريقة متزامنة (قواعد الحماية ستسمح بهذا لأن الطالب مسجل دخوله الآن)
          const updates = {};
          updates[`codes/${newCode}/isUsed`] = true;
          updates[`codes/${newCode}/usedBy`] = currentUserId;
          updates[`users/${currentUserId}/ncode`] = newCode;

          monthsToActivate.forEach(monthId => {
              updates[`student_month_access/${currentUserId}/${monthId}`] = expiryTimestamp;
          });

          await update(ref(db), updates);

          showMessage("تم تفعيل الكود بنجاح لحسابك! 🎉", false);
          
          activateBtn.style.display = 'none';
          newCodeInput.disabled = true;

      } catch (error) {
          console.error("خطأ أثناء التفعيل:", error);
          showMessage("حدث خطأ أثناء التفعيل. تأكد من صحة الكود أو حاول لاحقاً.", true);
          resetActivateButton();
      }
  });

  function resetActivateButton() {
      activateBtn.disabled = false;
      activateBtn.textContent = "تفعيل الحساب الآن";
  }
</script>
</body>
</html>
